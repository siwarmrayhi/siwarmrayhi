<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Siwar Mrayhi, Software Engineering Student" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1a1545"/>
      <stop offset="1" stop-color="#0a3a40"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5c0"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- network of nodes: a system coming alive -->
  <g stroke="url(#accent)" stroke-width="1.6" fill="none" stroke-opacity="0.7" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/>
    <line x1="800" y1="90" x2="935" y2="170"/>
    <line x1="935" y1="170" x2="850" y2="255"/>
    <line x1="935" y1="170" x2="1050" y2="85"/>
    <line x1="935" y1="170" x2="1085" y2="235"/>
    <line x1="1050" y1="85" x2="1150" y2="160"/>
    <line x1="1085" y1="235" x2="1150" y2="160"/>
    <line x1="800" y1="90" x2="1050" y2="85"/>
    <line x1="850" y1="255" x2="1085" y2="235"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="800" cy="90" r="7" fill="#00e5c0"><animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="935" cy="170" r="12" fill="#8b7bff"><animate attributeName="r" values="11;15;11" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="255" r="7" fill="#00e5c0"><animate attributeName="r" values="6;9;6" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="85" r="8" fill="#ff6b9d"><animate attributeName="r" values="7;10;7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1085" cy="235" r="7" fill="#00e5c0"><animate attributeName="r" values="6;9;6" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="160" r="6" fill="#8b7bff"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- identity -->
  <text x="60" y="95" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#00e5c0" letter-spacing="3">&lt;software_engineer /&gt;</text>
  <text x="60" y="165" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="1">Siwar Mrayhi</text>
  <rect x="60" y="185" width="180" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="225" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#c9d1ff">Software Engineering Student · ISI Tunis · Class of 2027</text>

  <!-- cycling terminal line -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="20" fill="#e8ecff">
    <text x="60" y="272" opacity="0">
      <tspan fill="#00e5c0">&gt; </tspan>designing.clean_software()
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="272" opacity="0">
      <tspan fill="#00e5c0">&gt; </tspan>modeling.data_into_insight()
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="272" opacity="0">
      <tspan fill="#00e5c0">&gt; </tspan>shipping.intelligent_systems()
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
    <rect x="470" y="256" width="10" height="20" fill="#00e5c0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
